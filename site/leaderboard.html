<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaderboard · JCI Atlantic Constitution Games</title>
<meta name="theme-color" content="#0081c6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* Layout: one column. Board picker + period switch, then a ranked list; top three get medal badges. */
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 44px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(2rem,9vw,3rem)}
.sub{color:var(--muted);font-weight:600}
.boards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.boards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.boards a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:2.5px solid var(--border);border-radius:14px;
  padding:10px 12px;box-shadow:3px 3px 0 var(--shade);font-weight:800;font-size:.9rem;line-height:1.2}
.boards a small{font-weight:600;color:var(--muted);font-size:.75rem}
.boards a[aria-current="true"]{background:var(--blue);color:var(--blue-ink)}
.boards a[aria-current="true"] small{color:var(--blue-ink);opacity:.85}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:2.5px solid var(--border);border-radius:12px;padding:3px;gap:3px;box-shadow:2px 2px 0 var(--shade)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:9px;font-weight:800;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-color)}
.meta{font-size:.85rem;font-weight:600;color:var(--muted)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 16px;border-bottom:2px dashed var(--soft)}
.list li:last-child{border-bottom:0}
.rank{font-family:var(--display);font-weight:800;font-size:1rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.medal{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--border);display:grid;place-items:center;color:var(--on-color);box-shadow:2px 2px 0 var(--shade);margin:0 auto}
.m1{background:var(--gold)} .m2{background:#c9d6df} .m3{background:#e3a273}
.who{min-width:0;display:flex;align-items:center;gap:8px}
.who .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you{flex:none;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:var(--blue-ink);border-radius:99px;padding:2px 8px}
.list li.me{background:var(--blue-soft)}
.res{text-align:right;font-variant-numeric:tabular-nums}
.res b{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.res small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.gap{text-align:center;color:var(--muted);font-weight:800;padding:4px 0!important;border-bottom:2px dashed var(--soft)}
.gap{display:block!important}
.empty{padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;margin:0}
.skel{height:18px;border-radius:6px;background:var(--surface-2)}
</style></head><body>
<div class="app">
  <div class="hud">
    <a class="back" href="index.html">← All games</a>
    <div class="player" id="player"></div>
  </div>
  <div>
    <span class="label">Who knows the constitution best?</span>
    <h1 class="display">Leader<span class="hl">board</span></h1>
  </div>
  <nav class="boards" aria-label="Choose a leaderboard">
    <a href="#swipe-quick" data-b="swipe-quick">Swipe<small>Quick · 10 cards</small></a>
    <a href="#swipe-full" data-b="swipe-full">Swipe<small>Full · 32 cards</small></a>
    <a href="#adventure" data-b="adventure">Road to President<small>Fewest slip-ups</small></a>
    <a href="#crossword" data-b="crossword">Crossword<small>Points, all puzzles</small></a>
  </nav>
  <div class="bar">
    <div class="seg" role="group" aria-label="Time period">
      <button type="button" id="p-month" aria-pressed="true">This month</button>
      <button type="button" id="p-all" aria-pressed="false">All time</button>
    </div>
    <span class="meta" id="meta"></span>
    <a class="back" id="playLink" href="swipe.html">Play Swipe →</a>
  </div>
  <section class="panel" id="board" aria-live="polite"></section>
  <p class="sub" id="note"></p>
</div>
<script src="player.js"></script>
<script>
const $=id=>document.getElementById(id), esc=JCIPlayer.esc;
JCIPlayer.chip($("player"));
const BOARDS={
  "swipe-quick":{game:"swipe",mode:"quick",play:"swipe.html",name:"Swipe"},
  "swipe-full":{game:"swipe",mode:"full",play:"swipe.html",name:"Swipe"},
  "adventure":{game:"adventure",mode:"story",play:"adventure.html",name:"Road to President"},
  "crossword":{game:"crossword",mode:"total",play:"words.html",name:"the Crossword"}
};
let period="month";
const MONTH=new Date().toLocaleString("en-GB",{month:"long",timeZone:"Africa/Lagos"});
try{if(localStorage.getItem("jci-board-period")==="all")period="all"}catch(e){}
const NOTES={
  "swipe-quick":{month:"Each player's first quick round this month. Replays are practice. Ties go to the faster time.",
                 all:"Official monthly rounds added up: one quick round per month counts."},
  "swipe-full":{month:"Each player's first full round this month. Replays are practice. Ties go to the faster time.",
                all:"Official monthly rounds added up: one full round per month counts."},
  "adventure":{month:"Official runs finished this month. Only each player's first run ever counts.",
               all:"Each player's first run ever. Fewest slip-ups wins; ties go to the faster time."},
  "crossword":{month:"Points from official puzzle finishes this month, added up.",
               all:"Points from each player's first finish of every puzzle, added up. Ties go to the faster total time."}
};
function current(){const h=location.hash.slice(1);return BOARDS[h]?h:"swipe-quick"}
function time(s){return s<60?s+"s":Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function result(r,lower){
  if(r.count!==undefined&&current()==="crossword")return `<b>${r.score} pts</b><small>${r.count} puzzle${r.count>1?"s":""} · ${time(r.seconds)}</small>`;
  if(r.count!==undefined)return `<b>${r.score}/${r.total}</b><small>${r.count} month${r.count>1?"s":""} · ${time(r.seconds)}</small>`;
  return lower?`<b>${r.score}</b><small>${r.score===1?"slip-up":"slip-ups"} · ${time(r.seconds)}</small>`
              :`<b>${r.score}/${r.total}</b><small>${time(r.seconds)}</small>`;
}
function row(r,lower){
  const rk=r.rank<=3?`<span class="medal m${r.rank}"><span class="rank" style="color:inherit">${r.rank}</span></span>`:`<span class="rank">${r.rank}</span>`;
  return `<li class="${r.me?"me":""}">${rk}<span class="who"><span class="nm">${esc(r.name)}</span>${r.me?'<span class="you">You</span>':""}</span><span class="res">${result(r,lower)}</span></li>`;
}
function skeleton(){
  $("board").innerHTML=`<ul class="list">${[0,1,2,3].map(()=>`<li><span class="skel"></span><span class="skel"></span><span class="skel" style="width:48px"></span></li>`).join("")}</ul>`;
}
let seq=0;
function load(quiet){
  const key=current(),b=BOARDS[key],my=++seq;
  document.querySelectorAll(".boards a").forEach(a=>a.setAttribute("aria-current",a.dataset.b===key));
  $("note").textContent=NOTES[key][period];
  $("playLink").href=b.play;$("playLink").textContent="Play "+b.name+" →";
  $("p-month").setAttribute("aria-pressed",period==="month");$("p-all").setAttribute("aria-pressed",period==="all");
  if(quiet!==true){skeleton();$("meta").textContent=""}
  JCIPlayer.leaderboard({game:b.game,mode:b.mode,period}).then(d=>{
    if(my!==seq)return;
    if(!d||!d.ok){
      const off=d&&(d.error==="unavailable"||d.error==="not-configured");
      $("board").innerHTML=`<div class="empty"><h2>${off?"The leaderboard isn't switched on yet":"Can't load the leaderboard"}</h2>
        <p class="muted">${off?"The games still work. Scores will appear here once the leaderboard is connected.":"Check your connection and try again."}</p>
        ${off?"":'<button class="btn" id="retry">Try again</button>'}</div>`;
      if($("retry"))$("retry").onclick=()=>load();return;
    }
    $("meta").textContent=d.players?`${d.players} player${d.players>1?"s":""}`:"";
    if(!d.top.length){
      $("board").innerHTML=`<div class="empty"><h2>No scores ${period==="month"?"in "+MONTH+" yet":"yet"}</h2>
        <p class="muted">Be the first name on the board.</p><a class="btn main" style="text-decoration:none" href="${b.play}">Play now →</a></div>`;
      return;
    }
    $("board").innerHTML=`<ul class="list">${d.top.map(r=>row(r,d.lowerIsBetter)).join("")}${d.me?`<li class="gap">···</li>${row(d.me,d.lowerIsBetter)}`:""}</ul>`;
  });
}
$("p-month").onclick=()=>{period="month";try{localStorage.setItem("jci-board-period",period)}catch(e){}load()};
$("p-all").onclick=()=>{period="all";try{localStorage.setItem("jci-board-period",period)}catch(e){}load()};
addEventListener("hashchange",()=>load());
document.addEventListener("jci-name",()=>setTimeout(load,300));
// Refresh every 30 seconds while the page is open (handy on a projector)
setInterval(()=>{if(!document.hidden)load(true)},30000);
JCIPlayer.sync().then(()=>load());
</script>
</body></html>
