<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Constitution Swipe</title>
<meta name="theme-color" content="#0081c6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* Layout: one-screen game. A thick-outlined card deck centred, big true/false buttons beneath. */
html,body{height:100%}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:18px 24px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px}
.score{font-family:var(--display);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--surface);border:2.5px solid var(--border);border-radius:99px;padding:5px 14px;box-shadow:2px 2px 0 var(--shade)}
.score span{color:var(--blue)}
.bar{height:14px;background:var(--surface);border:2.5px solid var(--border);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-right:2.5px solid var(--border);transition:width .3s}

.stage{position:relative;flex:1;min-height:400px;display:grid}
.card{grid-area:1/1;background:var(--surface);border:2.5px solid var(--border);border-radius:24px;box-shadow:7px 7px 0 var(--shade);
  display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;will-change:transform}
.card.under{transform:rotate(3deg) translate(6px,10px);box-shadow:4px 4px 0 var(--shade)}
.card.under .card-top{background:var(--gold);color:var(--on-color)}
.card-top{background:var(--blue);color:var(--blue-ink);padding:12px 20px;border-bottom:2.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-top .ch{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.card-top .num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:.8rem}
.card-body{flex:1;padding:30px 22px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative}
.q{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,5.6vw,1.6rem);line-height:1.22;letter-spacing:-.03em;text-wrap:balance}
.hint{color:var(--muted);font-weight:600;font-size:.88rem}
.stamp{position:absolute;top:20px;padding:4px 14px;border:4px solid;border-radius:10px;font-family:var(--display);font-weight:800;
  font-size:1.5rem;letter-spacing:.02em;opacity:0;pointer-events:none;background:var(--surface)}
.stamp.t{right:16px;color:var(--mint);transform:rotate(12deg)}
.stamp.f{left:16px;color:var(--coral);transform:rotate(-12deg)}
.verdict{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;align-self:flex-start;border:2.5px solid var(--border);border-radius:12px;padding:4px 12px;color:var(--on-color);box-shadow:3px 3px 0 var(--shade)}
.verdict.ok{background:var(--mint)} .verdict.no{background:var(--coral)}
.answer{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.explain{font-size:1.05rem;font-weight:600}

.controls{display:flex;gap:12px}
.controls button,.panel button{flex:1}
.b-main,.b-ghost,.b-true,.b-false{border:2.5px solid var(--border);border-radius:16px;padding:14px 16px;font-weight:800;font-size:1.02rem;box-shadow:4px 4px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.b-main:active,.b-ghost:active,.b-true:active,.b-false:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shade)}
.b-main{background:var(--blue);color:var(--blue-ink)}
.b-ghost{background:var(--surface);color:var(--ink)}
.b-true{background:var(--mint);color:var(--on-color);font-family:var(--display);font-size:1.1rem}
.b-false{background:var(--coral);color:var(--on-color);font-family:var(--display);font-size:1.1rem}

.panel{padding:26px 22px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--blue)}
.panel h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,8.4vw,2.5rem);line-height:1.02;letter-spacing:-.04em;margin:0;text-wrap:balance}
.panel h1 em{font-style:normal;background:var(--gold);color:var(--on-color);padding:0 .15em;border-radius:.15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.panel p{color:var(--muted)}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.how div{border:2.5px solid var(--border);border-radius:14px;padding:12px;font-size:.88rem;font-weight:600}
.how strong{display:block;font-family:var(--display);font-size:1rem;color:var(--on-color)}
.how .l{background:var(--coral);color:var(--on-color)} .how .r{background:var(--mint);color:var(--on-color)}
.stack{display:flex;flex-direction:column;gap:12px}
.mantra{font-family:var(--display);font-weight:700;letter-spacing:.24em;font-size:.68rem;color:var(--muted);text-align:center}
.mantra b{color:var(--blue)}
.big{font-family:var(--display);font-weight:800;font-size:4.4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
.big small{font-size:1.5rem;color:var(--muted)}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;color:var(--blue)}
.ladder{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ladder li{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:10px;border:2px solid transparent}
.ladder li.on{background:var(--gold);color:var(--on-color);font-weight:800;border-color:var(--border)}
.missed{border-top:2px dashed var(--soft);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.missed h3{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.missed div{font-size:.92rem}
.missed div b{display:inline-block;margin-bottom:2px;font-size:.75rem;background:var(--gold);color:var(--on-color);border:2px solid var(--border);border-radius:99px;padding:1px 9px}
.best{font-size:.88rem;font-weight:700;color:var(--muted);text-align:center}
</style></head><body>
<div class="app">
  <div class="hud">
    <a class="back" href="index.html">← All games</a>
    <div class="score" id="score" hidden>Score <span id="scoreN">0</span></div>
  </div>
  <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
  <main id="view" class="stage"></main>
  <div class="controls" id="controls"></div>
</div>
<script>
const CARDS=[
 ["Vision & Purpose","JCI Atlantic's mantra is Grow | Impact | Lead.",true,"That's the one. Three words every member should know by heart.","Article 5-4"],
 ["Vision & Purpose","Zero Hunger is one of JCI Atlantic's five focal points.",true,"The five are Quality Education, Entrepreneurial Growth, Zero Hunger, Continued Innovation and Leadership Development Opportunities.","Article 5-3"],
 ["Vision & Purpose","JCI Atlantic can back a political party if most members agree.",false,"The LO must stay away from all partisan politics, and members keep their personal political activity separate from JCI.","Article 5-6"],
 ["Membership","You must be between 18 and 40 years old to be a member.",true,"Age limits are 18 to 40. Your membership runs until the end of the calendar year you turn 40.","Article 6-2"],
 ["Membership","Your membership ends on your 40th birthday.",false,"It continues until the end of the calendar year in which you turn 40.","Article 6-2"],
 ["Membership","Applications for the September induction close on 20 February.",true,"Applications go by email to the President through the Director of HR & Welfare, and none are received after 20 February.","Bylaw 6-3"],
 ["Membership","The probationary period lasts a minimum of three months.",false,"It's at least six months. Three months is only for reactivated members.","Bylaw 6-4"],
 ["Membership","Intending members must attend at least three General Assemblies during probation.",true,"Plus two JCI Atlantic projects, one JCI Nigeria event in Lagos, the intending members training, and paying dues.","Bylaw 6-4"],
 ["Membership","At induction, it's fine to read the JCI Creed from a card.",false,"Intending members recite the Creed off hand, then take the oath.","Article 6-5"],
 ["Membership","Newly inducted members can vote for officers at that year's AGM.",false,"New inductees can't vote for elected officers at the AGM of the year they were inducted.","Bylaw 6-7"],
 ["Membership","Ten straight months of inactivity gets your membership suspended.",true,"At 18 months of inactivity, membership is withdrawn.","Article 6-10"],
 ["Membership","Skipping dues for two years in a row is fine if you attend every event.",false,"Membership is withdrawn after two consecutive years of unpaid dues, regardless of attendance.","Article 6-10"],
 ["General Assembly","The General Assembly is the supreme authority of JCI Atlantic.",true,"It controls the LO's affairs and keeps every power not specifically given to the Board or an officer.","Article 7-1"],
 ["General Assembly","You can vote by proxy if you send a letter to the Secretary.",false,"Proxies are not recognized. Nobody casts more than one vote.","Article 7-7"],
 ["General Assembly","Quorum for a General Assembly is half of the total membership.",false,"Quorum is one-third (1/3) of the total membership.","Article 7-8"],
 ["General Assembly","Notice of a General Assembly must go out at least 14 days before.",true,"The agenda and last minutes follow at least 48 hours before the meeting.","Bylaw 7-9"],
 ["Meetings","Business meetings hold on the 3rd Sunday of every odd month.",true,"January, March, May, July, September and November.","Article 8-1"],
 ["Meetings","Business casual is acceptable at the November AGM.",false,"Dressing to the AGM is strictly formal or traditional. Business casual isn't accepted.","Article 8-1, Sec. 2"],
 ["Meetings","An ordinary member who arrives late without notice pays a 500 naira fine.",true,"Other Board members pay 1,000 naira and Executive Committee members pay 1,500. Late means arriving less than 5 minutes before start time.","Article 8-1, Sec. 5"],
 ["Meetings","Improper dressing costs 1,000 naira and your speaking and voting rights at that meeting.",true,"Both penalties apply together.","Article 8-1, Sec. 5"],
 ["Officers","JCI Atlantic's elected officers are the President and two Vice Presidents.",true,"The VPs cover Administration and Projects. Everyone else on the Board is appointed.","Article 9-1"],
 ["Officers","An officer can hold the same office for two terms in a row.",false,"No officer may hold the same office for more than one term.","Article 9-9"],
 ["Officers","A presidential candidate must have served at least three complete tenures on the Board.",true,"They must also be a VP (past or current) and a member in good standing for at least 35 months.","Article 9-9, Sec. 5"],
 ["Officers","The nomination fee to run for President is 10,000 naira.",true,"It's 5,000 naira for Vice President.","Bylaw 9-6.2"],
 ["Officers","If the President can't continue, the VP Project steps in first.",false,"The VP Administration has the first right of refusal. The VP Project is next.","Bylaw 9-10, Sec. 3"],
 ["Officers","Officers receive a monthly allowance for their service.",false,"All officers serve without financial remuneration.","Bylaw 9-12"],
 ["Board & Exco","A Board of Directors meeting needs at least 60% of its members to form a quorum.",true,"The Executive Committee needs at least 5 of its members.","Bylaw 11-4"],
 ["Board & Exco","The Meeting Manager must have the venue set at least 45 minutes before start time.",true,"Projector, microphones, seats and the rest.","Article 11-6"],
 ["Dues & Benefits","Annual dues must be paid by 31 March.",true,"Miss it without a payment plan and you lose your vote, speaking rights and financial benefits.","Article 15-1"],
 ["Dues & Benefits","The LO gives 40,000 naira when two members marry each other.",true,"A member marrying a non-member receives 15,000 naira.","Bylaw 15-5"],
 ["Amendments","A simple majority at the AGM is enough to amend the constitution.",false,"Amendments need a two-thirds vote, with written notice 30 days before the AGM.","Article 19-1"],
 ["Amendments","Approved amendments take effect immediately after the AGM.",false,"They take effect on 1 January of the following year.","Article 19-3"]
];
// Twin versions of the same rule with the opposite answer: card index -> [statement, truth, explanation]
const TWINS={
 0:["JCI Atlantic's mantra is Lead | Serve | Inspire.",false,"The mantra is Grow | Impact | Lead."],
 3:["You can join JCI Atlantic from age 16.",false,"The minimum age is 18, and the maximum is 40."],
 5:["Applications for the September induction stay open until 31 March.",false,"They close on 20 February. Nothing is received after that date."],
 6:["The probationary period lasts a minimum of six months.",true,"During it, intending members attend General Assemblies, projects, a JCI Nigeria event and the intending members training."],
 10:["Membership is suspended after just 3 months of inactivity.",false,"Suspension comes after 10 consecutive months of inactivity, and withdrawal after 18."],
 13:["Each member present gets one vote, and proxies aren't allowed.",true,"Proxies are not recognized. Nobody casts more than one vote."],
 14:["Quorum for a General Assembly is one-third of the total membership.",true,"One-third (1/3) of the total membership must be present."],
 15:["Notice of a General Assembly only needs to go out 7 days before.",false,"It's at least 14 days. Seven days is the notice for a Special General Meeting."],
 18:["An ordinary member who arrives late without notice pays a 1,500 naira fine.",false,"Ordinary members pay 500 naira. 1,500 naira is the fine for Executive Committee members."],
 22:["A presidential candidate needs only one complete tenure on the Board.",false,"At least three complete tenures are required, and they must be on the current Board."],
 23:["The nomination fee to run for President is 5,000 naira.",false,"It's 10,000 naira. 5,000 naira is the fee for Vice President."],
 24:["If the President can't continue, the VP Administration has the first right to step in.",true,"If the VP Administration declines, the VP Project takes over, subject to approval at the next general meeting."],
 26:["A Board of Directors meeting needs only half of its members to form a quorum.",false,"Board quorum is at least 60% of its members."],
 28:["Annual dues must be paid by 31 January.",false,"The deadline is 31 March."],
 29:["The LO gives 15,000 naira when two members marry each other.",false,"Two members marrying each other receive 40,000 naira. 15,000 naira is for a member marrying a non-member."],
 30:["Amending the constitution needs a two-thirds vote at the AGM.",true,"Written notice of the amendment must also be given 30 days before the AGM."],
 31:["Approved amendments take effect on 1 January of the following year.",true,"They need a two-thirds majority of financial members at the AGM first."]
};
const RANKS=[[0,"Intending Member"],[40,"Inducted Member"],[60,"Board Director"],[80,"Vice President"],[100,"President"]];
const $=id=>document.getElementById(id);
const view=$("view"),controls=$("controls");
let deck=[],i=0,score=0,missed=[],answered=false,mode="quick";

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function home(){
  $("score").hidden=true;$("barWrap").hidden=true;
  const best=store("jci-best");
  view.innerHTML=`<section class="panel">
    <div class="eyebrow">2022 Constitution &amp; Policy Manual</div>
    <h1>How well do you know <em>our constitution?</em></h1>
    <p>Each card is a statement about the JCI Atlantic constitution. Decide if it's true or false, then see what the constitution actually says.</p>
    <div class="how"><div class="l"><strong>← False</strong>Swipe left or press ←</div><div class="r"><strong>True →</strong>Swipe right or press →</div></div>
    <div class="stack">
      <button class="b-main" id="q">Quick round · 10 cards</button>
      <button class="b-ghost" id="f">Full constitution · ${CARDS.length} cards</button>
    </div>
    ${best?`<div class="best">Your best: ${esc(best)}</div>`:""}
    <div class="mantra"><b>GROW</b> · IMPACT · <b>LEAD</b></div>
  </section>`;
  controls.innerHTML="";
  $("q").onclick=()=>start("quick");$("f").onclick=()=>start("full");
}

function start(m){
  mode=m;
  let ids=CARDS.map((_,k)=>k);
  if(m==="quick"){
    // Prefer cards not yet played; refill the pool once everything has been seen
    let seen=[];try{seen=JSON.parse(store("jci-seen")||"[]")}catch(e){}
    let fresh=shuffle(ids.filter(k=>!seen.includes(k)));
    if(fresh.length<10){seen=[];fresh=fresh.concat(shuffle(ids.filter(k=>!fresh.includes(k))))}
    ids=fresh.slice(0,10);
    store("jci-seen",JSON.stringify(seen.concat(ids)));
  }
  deck=shuffle(ids).map(k=>{
    const c=CARDS[k],tw=TWINS[k];
    if(tw&&Math.random()<.5)return [c[0],tw[0],tw[1],tw[2],c[4]];
    return c;
  });
  i=0;score=0;missed=[];$("score").hidden=false;$("barWrap").hidden=false;show();
}

function show(){
  answered=false;
  $("scoreN").textContent=score;$("bar").style.width=(i/deck.length*100)+"%";
  const [ch,q]=deck[i],next=deck[i+1];
  view.innerHTML=(next?`<div class="card under"><div class="card-top"><span class="ch">${esc(next[0])}</span></div><div class="card-body"></div></div>`:"")+
  `<div class="card" id="card"><div class="card-top"><span class="ch">${esc(ch)}</span><span class="num">${i+1} / ${deck.length}</span></div>
   <div class="card-body" id="cb"><span class="stamp t" id="st">TRUE</span><span class="stamp f" id="sf">FALSE</span>
   <div class="q">${esc(q)}</div><div class="hint">True or false?</div></div></div>`;
  controls.innerHTML=`<button class="b-false" id="bf">✕ False</button><button class="b-true" id="bt">✓ True</button>`;
  $("bf").onclick=()=>fling(false);$("bt").onclick=()=>fling(true);
  drag($("card"));
}

function drag(card){
  let x0=null,dx=0;
  card.addEventListener("pointerdown",e=>{if(answered)return;x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition="none"});
  card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;
    card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    $("st").style.opacity=Math.max(0,dx/90);$("sf").style.opacity=Math.max(0,-dx/90)});
  const end=()=>{if(x0===null)return;x0=null;
    if(Math.abs(dx)>90)fling(dx>0);
    else{card.style.transition="transform .25s";card.style.transform="";$("st").style.opacity=0;$("sf").style.opacity=0}};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
}

function fling(guess){
  if(answered)return;answered=true;
  const card=$("card"),[ch,q,truth,why,art]=deck[i],ok=guess===truth;
  if(ok)score++;else missed.push(deck[i]);
  $("scoreN").textContent=score;
  const dir=guess?1:-1;
  card.style.transition="transform .22s ease-in, opacity .22s";
  card.style.transform=`translateX(${dir*120}px) rotate(${dir*8}deg)`;card.style.opacity="0";
  setTimeout(()=>{
    card.style.transition="none";card.style.transform="scale(.96)";card.style.opacity="1";
    $("cb").innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"✓ Correct":"✕ Not quite"}</div>
      <div class="answer">The statement is ${truth?"true":"false"}</div>
      <div class="q" style="font-size:1.1rem;color:var(--muted)">${esc(q)}</div>
      <div class="explain">${esc(why)}</div><span class="cite">${esc(art)}</span>`;
    requestAnimationFrame(()=>{card.style.transition="transform .25s";card.style.transform=""});
    controls.innerHTML=`<button class="b-main" id="nx">${i+1<deck.length?"Next card →":"See my rank →"}</button>`;
    $("nx").onclick=nextCard;$("nx").focus();
  },220);
}

function nextCard(){i++;if(i<deck.length)show();else finish()}

function finish(){
  $("bar").style.width="100%";
  const pct=Math.round(score/deck.length*100);
  let r=0;RANKS.forEach((x,k)=>{if(pct>=x[0])r=k});
  const label=`${score}/${deck.length} (${RANKS[r][1]})`;
  const prev=store("jci-best-pct");
  if(prev===null||pct>+prev){store("jci-best-pct",pct);store("jci-best",label)}
  view.innerHTML=`<section class="panel">
    <div class="eyebrow">Round complete</div>
    <div class="big">${score}<small> / ${deck.length}</small></div>
    <div><div class="answer">Your rank</div><div class="rank">${RANKS[r][1]}</div></div>
    <ul class="ladder">${RANKS.slice().reverse().map((x,k)=>`<li class="${RANKS.length-1-k===r?"on":""}"><span>${x[1]}</span><span>${x[0]}%+</span></li>`).join("")}</ul>
    ${missed.length?`<div class="missed"><h3>Worth another read</h3>${missed.map(m=>`<div><b>${esc(m[4])}</b>${esc(m[3])}</div>`).join("")}</div>`:`<p>A perfect round. The General Legal Counsel would be proud.</p>`}
  </section>`;
  controls.innerHTML=`<button class="b-ghost" id="hm">Home</button><button class="b-main" id="ag">Play again</button>`;
  $("hm").onclick=home;$("ag").onclick=()=>start(mode);
}

document.addEventListener("keydown",e=>{
  if(!$("card"))return;
  if(!answered&&e.key==="ArrowLeft")fling(false);
  else if(!answered&&e.key==="ArrowRight")fling(true);
});
home();
</script>
</body></html>
