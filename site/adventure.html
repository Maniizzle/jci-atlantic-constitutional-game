<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road to President</title>
<meta name="theme-color" content="#0081c6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* Layout: narrow column. A stepped career ladder (bars rise left to right) above the scene panel. */
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 36px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px}
.slips{font-family:var(--display);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;background:var(--surface);border:2.5px solid var(--border);border-radius:99px;padding:5px 14px;box-shadow:2px 2px 0 var(--shade)}
.slips span{color:var(--coral)}

.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.ladder div{display:flex;flex-direction:column;gap:6px;font-size:.62rem;font-weight:800;line-height:1.15;color:var(--muted);text-align:center;letter-spacing:.02em}
.ladder div::before{content:"";border:2.5px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:2px 2px 0 var(--shade)}
.ladder div:nth-child(1)::before{height:14px}.ladder div:nth-child(2)::before{height:20px}.ladder div:nth-child(3)::before{height:26px}
.ladder div:nth-child(4)::before{height:32px}.ladder div:nth-child(5)::before{height:38px}.ladder div:nth-child(6)::before{height:46px}
.ladder div.done::before{background:var(--gold)}
.ladder div.now{color:var(--ink)}
.ladder div.now::before{background:var(--blue)}

.top{background:var(--blue);color:var(--blue-ink);border-bottom:2.5px solid var(--border);padding:11px 18px;display:flex;justify-content:space-between;gap:8px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.top.bad{background:var(--coral);color:var(--on-color)} .top.good{background:var(--mint);color:var(--on-color)}
.body{padding:24px 22px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.04em;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,9vw,2.8rem);line-height:1.02}
h1 em{font-style:normal;background:var(--gold);color:var(--on-color);padding:0 .15em;border-radius:.15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
h2{font-size:1.45rem;line-height:1.15}
.body>p{font-size:1.05rem}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{text-align:left;background:var(--surface);color:var(--ink);border:2.5px solid var(--border);border-radius:16px;padding:14px 16px;font-size:.98rem;font-weight:600;line-height:1.4;
  display:flex;gap:14px;align-items:flex-start;box-shadow:4px 4px 0 var(--shade);transition:transform .08s,box-shadow .08s,background .15s}
.choice:hover{background:var(--blue-soft)}
.choice:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shade)}
.choice .k{font-family:var(--display);font-weight:800;flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--border);background:var(--gold);color:var(--on-color);display:grid;place-items:center;font-size:.8rem}
.main,.ghost{border:2.5px solid var(--border);border-radius:16px;padding:14px 16px;font-weight:800;font-size:1rem;box-shadow:4px 4px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.main:active,.ghost:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shade)}
.main{background:var(--blue);color:var(--blue-ink)}
.ghost{background:var(--surface);color:var(--ink)}
.row>button{flex:1}
.rule{border-top:2px dashed var(--soft);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.fail{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.15;letter-spacing:-.035em;color:var(--coral)}
.win{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.03em;color:var(--mint)}
.big{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.sash{font-family:var(--display);font-weight:700;letter-spacing:.24em;font-size:.68rem;color:var(--muted);text-align:center}
.sash b{color:var(--blue)}
</style></head><body>
<div class="app">
  <div class="hud">
    <a class="back" href="index.html">← All games</a>
    <div class="slips" id="slips" hidden>Slip-ups <span id="slipN">0</span></div>
  </div>
  <div class="ladder" id="ladder"></div>
  <main id="view"></main>
</div>
<script>
const STAGES=["Applicant","Intending Member","Member","Director","Vice President","President"];
const SCENES=[
 {s:0,title:"The application",
  text:"It's 10 February. You've been to a few JCI Atlantic events and you're hooked. You want to be inducted this September. How do you apply?",
  choices:[
   {t:"Email your application to the President through the Director of HR & Welfare, with your birth certificate and a reference letter from a member in good standing.",ok:true},
   {t:"Turn up at the next General Assembly, pay 30,000 naira cash and ask to be inducted on the spot.",fail:"Politely escorted to the refreshments table",why:"Applications go in writing by email, through the Director of HR & Welfare, before 20 February. There's no walk-in induction."},
   {t:"Ask your friend who's a member to add you to the WhatsApp group. That makes it official.",fail:"Added to the group. Still not a member.",why:"Membership starts with a written application and a reference letter. The Board then votes on it."}],
  win:"Applications for September close on 20 February, and the Board accepts them by majority vote. You'll get an acceptance letter by the first weekend in March.",art:"Bylaw 6-3"},
 {s:1,title:"Probation plan",
  text:"You're accepted as an intending member. Probation lasts at least six months. Which plan gets you to induction?",
  choices:[
   {t:"Go to every project, but skip the intending members training. Projects count more.",fail:"Automatically disqualified",why:"Taking part in activities but neglecting the intending members training (or the other way round) is an automatic disqualification for induction."},
   {t:"Attend 3 General Assemblies, 2 projects, 1 JCI Nigeria event in Lagos, the intending members training, and pay 30,000 naira dues before induction.",ok:true},
   {t:"Attend one General Assembly and make a big donation instead.",fail:"Thanked warmly. Not inducted.",why:"The probation checklist is fixed: three General Assemblies, two projects, a JCI Nigeria event, the training, and dues."}],
  win:"After the intending members interview (with your 5-year plan), the Board confirms who gets inducted in the first week of September.",art:"Bylaw 6-4"},
 {s:1,title:"Induction night",
  text:"It's September and you're at the front of the room. The President asks you to recite the JCI Creed.",
  choices:[
   {t:"Read it from your phone. Nobody memorizes these things.",fail:"The whole room recites it for you, slowly",why:"Intending members recite the Creed off hand at induction."},
   {t:"Recite it from memory, then take the oath.",ok:true},
   {t:"Ask to skip the Creed and go straight to the lapel pin.",fail:"No pin for you tonight",why:"The Creed comes first, then the oath, then the lapel pin, certificate and a copy of the constitution."}],
  win:"You recite the Creed, take the oath, and the President pins your JCI lapel pin. Welcome to JCI Atlantic.",art:"Article 6-5"},
 {s:2,title:"Your first AGM",
  text:"It's the November Annual General Meeting, your first as a full member. What do you wear?",
  choices:[
   {t:"Smart business casual. Chinos, a nice shirt, no tie.",fail:"Fined 1,000 naira and muted for the day",why:"Dressing to the AGM is strictly formal or traditional. Improper dressing costs 1,000 naira and your speaking and voting rights at that meeting."},
   {t:"Formal or traditional attire.",ok:true},
   {t:"Your JCI Atlantic t-shirt. Show some team spirit.",fail:"Team spirit noted. Fine also noted.",why:"Business meetings call for formal, business casual or traditional attire, and the AGM only accepts formal or traditional."}],
  win:"You look the part. The AGM is strictly formal or traditional.",art:"Article 8-1, Sec. 2"},
 {s:2,title:"Election time",
  text:"The elections begin. A candidate for President is your friend and you'd love to vote for them. What happens?",
  choices:[
   {t:"You vote. You're a member now, and every vote counts.",fail:"Your ballot is gently handed back",why:"Newly inducted members can't vote for elected officers at the AGM of the year they were inducted."},
   {t:"Give your vote to a senior member as your proxy.",fail:"The General Legal Counsel shakes her head",why:"Proxies aren't recognized, and no one can cast more than one vote."},
   {t:"You watch this one. New inductees can't vote for officers at the AGM of their induction year.",ok:true}],
  win:"Next year you'll have the vote. For now, you get a front-row view of how elections run.",art:"Bylaw 6-7"},
 {s:2,title:"Dues season",
  text:"It's March and money is tight. You can't pay the 30,000 naira dues all at once. What do you do?",
  choices:[
   {t:"Relax. Dues are due by December.",fail:"April arrives. Your vote doesn't.",why:"Dues are due by 31 March. After that you lose your vote, your speaking rights and financial benefits."},
   {t:"Agree a payment plan with the Director of Finance before 31 March, finishing by 31 May.",ok:true},
   {t:"Skip this year and pay double next year.",fail:"Two years unpaid, membership withdrawn",why:"Not paying for two consecutive years means automatic withdrawal of membership."}],
  win:"A payment plan agreed before 31 March keeps your rights, as long as it ends by 31 May.",art:"Bylaw 15-4"},
 {s:2,title:"Running late",
  text:"You know you'll be late to Sunday's General Assembly. What do you do?",
  choices:[
   {t:"Email the General Secretary at least 12 hours before the meeting.",ok:true},
   {t:"Post 'running late' in the WhatsApp group five minutes before start.",fail:"Fined 500 naira for lateness",why:"Apologies go by email to the General Secretary, at least 12 hours before the meeting. Late without notice means a fine."},
   {t:"Just slip in quietly. Nobody notices one person.",fail:"The Meeting Manager notices. The Meeting Manager always notices.",why:"The Meeting Manager takes attendance. Arriving less than 5 minutes before start time without notice counts as late."}],
  win:"Written notice by email, 12 hours ahead, keeps you in the clear.",art:"Article 8-1, Sec. 3"},
 {s:3,title:"Joining the Board",
  text:"You're appointed Director of Communications. The Officers Training School in January clashes with a trip. What do you do?",
  choices:[
   {t:"Skip it. You'll read the notes later.",fail:"Your seat goes to someone else",why:"The OTS is mandatory for all officers. Missing it is grounds for terminating your position and appointing someone new."},
   {t:"Move the trip and attend the OTS.",ok:true},
   {t:"Send your assistant to attend on your behalf.",fail:"Your assistant now has your job",why:"Every officer must attend the OTS themselves."}],
  win:"Good call. And as Director of Communications, remember: at least two social media posts every week.",art:"Bylaw 13-5"},
 {s:3,title:"Ambition",
  text:"You've been a member for 15 months with one Board tenure. You want to run for Vice President this year. Can you?",
  choices:[
   {t:"Yes. Any member in good standing can run.",fail:"Nomination returned by the committee",why:"VP candidates need at least 23 months of membership and two complete Board tenures, among other requirements."},
   {t:"Not yet. You need 23 months as a member and two complete Board tenures.",ok:true},
   {t:"Yes, if you pay double the nomination fee.",fail:"The committee is not for sale",why:"The nomination fee doesn't change eligibility."}],
  win:"VP candidates also need to be on the current Board, have attended a JCIN area conference and a national convention, have 70% attendance this year, and have completed two JCI courses.",art:"Article 9-9, Sec. 6"},
 {s:4,title:"The nomination",
  text:"A year later, you're eligible. How do you get on the ballot for Vice President?",
  choices:[
   {t:"Stand up at the AGM and announce yourself.",fail:"The President asks if there are written nominations. There are.",why:"Verbal nominations at the AGM happen only if no written nomination has come in for that office."},
   {t:"Get a written nomination from two members in good standing to the Nomination Committee at least 30 days before the AGM, then pay 5,000 naira.",ok:true},
   {t:"Send your election flier to every platform straight away.",fail:"Flier pulled for review",why:"The Nomination Committee must review and approve fliers before they go out."}],
  win:"You're on the ballot. You win, and you're assigned to Administration.",art:"Bylaw 9-6.3"},
 {s:4,title:"The unexpected",
  text:"Midway through your term as VP Administration, the President relocates abroad and can't continue. What happens?",
  choices:[
   {t:"The VP Project automatically becomes President.",fail:"The General Legal Counsel reads the bylaw aloud",why:"The VP Administration has the first right of refusal. The VP Project steps in only if they decline."},
   {t:"You have the first right of refusal. If you accept, it's subject to approval at the next General Membership Meeting.",ok:true},
   {t:"The Board calls a snap election that weekend.",fail:"Nice try. No snap elections.",why:"A presidential vacancy goes to the VP Administration first, then the VP Project."}],
  win:"You step up to finish the term. Now for the real test: running for a full term of your own.",art:"Bylaw 9-10, Sec. 3"},
 {s:4,title:"Running for President",
  text:"You want to run for a full term as President. Which checklist do you need to meet?",
  choices:[
   {t:"Be financial, 3 complete Board tenures, on the current Board, VP experience, 35 months of membership, a JCIN area conference and national convention, 70% attendance this year, and 3 JCI courses.",ok:true},
   {t:"Be financial and have 18 months of membership. Experience comes on the job.",fail:"Nomination returned. Again.",why:"Presidential candidates need 35 months of membership, three complete Board tenures and VP experience, among other requirements."},
   {t:"Anything goes. You've already been acting President.",fail:"Acting is not the same as eligible",why:"Every presidential candidate must meet the full list of qualifications, without exception."}],
  win:"You meet every requirement. On AGM day, the votes are counted.",art:"Article 9-9, Sec. 5"}
];

const $=id=>document.getElementById(id);
const view=$("view");
let n=0,slips=0;
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function ladder(stage){
  $("ladder").innerHTML=STAGES.map((x,k)=>`<div class="${k<stage?"done":k===stage?"now":""}">${x}</div>`).join("");
}

function intro(){
  $("slips").hidden=true;ladder(-1);
  view.innerHTML=`<section class="panel"><div class="top"><span>A JCI Atlantic adventure</span><span>12 scenes</span></div>
  <div class="body">
    <h1>From applicant to <em>President</em></h1>
    <p>You're a young professional in Lagos who wants to join JCI Atlantic. Make the right calls, and you'll rise from applicant to President. Make the wrong ones, and the constitution will have something to say about it.</p>
    <p class="muted">Every scene is based on the 2022 Constitution &amp; Policy Manual.</p>
    <button class="main" id="go">Start my journey</button>
    <div class="sash"><b>GROW</b> · IMPACT · <b>LEAD</b></div>
  </div></section>`;
  $("go").onclick=()=>{n=0;slips=0;$("slips").hidden=false;$("slipN").textContent=0;scene()};
}

function scene(){
  const sc=SCENES[n];ladder(sc.s);
  const opts=shuffle(sc.choices);
  view.innerHTML=`<section class="panel"><div class="top"><span>${STAGES[sc.s]}</span><span>Scene ${n+1} of ${SCENES.length}</span></div>
  <div class="body"><h2>${esc(sc.title)}</h2><p>${esc(sc.text)}</p>
  <div class="choices">${opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="k">${"ABC"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div></div></section>`;
  view.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(opts[+b.dataset.k]));
  view.querySelector(".choice").focus({preventScroll:true});
  window.scrollTo({top:0});
}

function pick(o){
  const sc=SCENES[n];
  if(o.ok){
    view.innerHTML=`<section class="panel"><div class="top good"><span>Good call</span><span>${esc(sc.art)}</span></div>
    <div class="body"><div class="win">✓ ${esc(sc.title)}: done</div><p>${esc(sc.win)}</p>
    <span class="cite">${esc(sc.art)}</span>
    <button class="main" id="nx">${n+1<SCENES.length?"Continue →":"Count the votes →"}</button></div></section>`;
    $("nx").onclick=()=>{n++;n<SCENES.length?scene():finale()};$("nx").focus();
  }else{
    slips++;$("slipN").textContent=slips;
    view.innerHTML=`<section class="panel"><div class="top bad"><span>Game over (sort of)</span><span>${esc(sc.art)}</span></div>
    <div class="body"><div class="fail">${esc(o.fail)}</div>
    <p class="muted">You chose: ${esc(o.t)}</p>
    <div class="rule"><span class="label">What the constitution says</span><p>${esc(o.why)}</p><span class="cite">${esc(sc.art)}</span></div>
    <div class="row"><button class="ghost" id="rs">Start over</button><button class="main" id="rw">Rewind this scene</button></div></div></section>`;
    $("rw").onclick=scene;$("rs").onclick=intro;$("rw").focus();
  }
}

function finale(){
  ladder(5);
  const verdict=slips===0?"A flawless campaign. The General Legal Counsel wants to hire you.":slips<=3?"A few stumbles on the way, but you knew your constitution when it counted.":"You got there, though the constitution had to remind you a few times. Maybe give it another read.";
  view.innerHTML=`<section class="panel"><div class="top good"><span>AGM results</span><span>Elected</span></div>
  <div class="body"><span class="label">Elected by majority vote</span>
  <h1>You're the <em>President</em></h1>
  <p>The Nomination Committee announces the result to the General Assembly, and you take the oath of office. Your term starts on 1 January.</p>
  <div><span class="label">Slip-ups on the way</span><div class="big">${slips}</div></div>
  <p>${verdict}</p>
  <div class="row"><button class="main" id="ag">Play again</button></div>
  <div class="sash"><b>GROW</b> · IMPACT · <b>LEAD</b></div></div></section>`;
  $("ag").onclick=intro;
}
intro();
</script>
</body></html>
