server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Health check for the platform
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # HTML: always revalidate so new questions show up right away
    location ~* \.html$ { expires epoch; }
    location ~* \.(css|svg)$ { expires 1d; }

    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}
